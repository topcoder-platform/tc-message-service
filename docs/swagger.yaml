swagger: "2.0"
info:
  version: "v5"
  title: "Message Service"
  description: |
    The message service provides apis for members to be able to collaborate within the topcoder platform. It provides capabilities to create public and private threaded conversations associated with specific topcoder entities such as projects, challenges, submissions, etc. and general discussions not associated with any specific entity.

# during production should point to your server machine
host: local.topcoder-dev.com:3000
basePath: "/v5"
# during production should point to https
schemes:
- http
- https
produces:
- application/json
consumes:
- application/json

securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    
tags:
  - name: Admins
  - name: Topics
  - name: Posts
  - name: Attachments
  - name: Webhooks
  - name: Others

paths:
  /topics/create:
    post:
      tags:
        - Topics
      operationId: createTopic
      security:
        - Bearer: []
      summary: Create topic
      description: Creates a new topic for the specified(via referenceId) reference'd entity.
      parameters:
        - in: body
          name: body
          required: true
          description: Topic parameters
          schema:
            $ref: '#/definitions/NewTopicBodyParam'
      responses:
        '200':
          description: Success. Returns newly created topic
          schema:
            $ref: "#/definitions/NewTopicResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/edit:
    post:
      tags:
        - Topics
      operationId: updateTopic
      security:
        - Bearer: []
      summary: Update topic
      description: Updates the specified topic.
      parameters:
        - name: topicId
          in: path
          description: id of the topic to be updated
          required: true
          type: number
        - in: body
          name: body
          required: true
          description: Topic parameters
          schema:
            $ref: '#/definitions/UpdateTopicBodyParam'
      responses:
        '200':
          description: Success. Returns updated topic
          schema:
            $ref: "#/definitions/NewTopicResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/list:  
    get:
      tags:
        - Topics
      operationId: getTopics
      security:
        - Bearer: []
      summary: Lists topics
      description:  Lists topics according to specified filters.
      parameters:
        - name: filter
          required: true
          type: string
          in: query
          description: |
            A URL-encoded string that specify criteria for topics matching.
            Should be in the form `reference={ref_type}&referenceId={ref_id}&tag={tag}`, where:
            - ref_type(required) - type of entity with which the topic is associated, e.g. `project`, `challenge`, `submission`, etc.
            - ref_id(required) - id of entity with which the topic is associated, e.g. `455`.
            - tag(optional) - tag field of the topic, e.g. `PRIMARY`
            
            Example: `reference=project&referenceId=1450&tag=PRIMARY`
      responses:
        '200':
          description: Success. Returns list of topics
          schema:
            $ref: "#/definitions/TopicListResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/list/db:  
    get:
      tags:
        - Topics
      operationId: getTopicsDB
      security:
        - Bearer: []
      summary: Lists topics from db
      description:  Lists topics according to specified filters.
      parameters:
        - name: filter
          required: true
          type: string
          in: query
          description: |
            A URL-encoded string that specify criteria for topics matching.
            Should be in the form `reference={ref_type}&referenceId={ref_id}&tag={tag}`, where:
            - ref_type(required) - type of entity with which the topic is associated, e.g. `project`, `challenge`, `submission`, etc.
            - ref_id(required) - id of entity with which the topic is associated, e.g. `455`.
            - tag(optional) - tag field of the topic, e.g. `PRIMARY`
            
            Example: `reference=project&referenceId=1450&tag=PRIMARY`
      responses:
        '200':
          description: Success. Returns list of topics
          schema:
            $ref: "#/definitions/TopicListResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/read:
    get:
      tags:
        - Topics
      operationId: getTopic
      security:
        - Bearer: []
      summary: Get topic
      description: Fetches the details of the specified topic.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic to be fetched
          required: true
          type: number
      responses:
        '200':
          description: Success. Returns the topic
          schema:
            $ref: "#/definitions/TopicResponse"
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/read/db:
    get:
      tags:
        - Topics
      operationId: getTopicDB
      security:
        - Bearer: []
      summary: Get topic from db
      description: Fetches the details of the specified topic.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic to be fetched
          required: true
          type: number
      responses:
        '200':
          description: Success. Returns the topic
          schema:
            $ref: "#/definitions/TopicResponse"
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/remove:
    delete:
      tags:
        - Topics
      operationId: deleteTopic
      security:
        - Bearer: []
      summary: Delete topic
      description: Deletes the specified topic.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic to be deleted
          required: true
          type: number
      responses:
        '200':
          description: Success.
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/posts/create:
    post:
      tags:
        - Posts
      operationId: createPost
      security:
        - Bearer: []
      summary: Creates post
      description: Creates a new post for the given topic.
      parameters:
        - name: topicId
          in: path
          description: id of the topic
          required: true
          type: number
        - in: body
          name: body
          required: true
          description: Post parameters
          schema:
            $ref: '#/definitions/NewPostBodyParam'
      responses:
        '200':
          description: Success. Returns newly created topic
          schema:
            $ref: "#/definitions/NewPostResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/posts/{postId}/edit:
    post:
      tags:
        - Posts
      operationId: updatePost
      security:
        - Bearer: []
      summary: Update post
      description: Updates the specified post.
      parameters:
        - name: topicId
          in: path
          description: id of the topic of the post to be updated
          required: true
          type: number
        - name: postId
          in: path
          description: id of the post to be updated
          required: true
          type: number
        - in: body
          name: body
          required: true
          description: Topic parameters
          schema:
            $ref: '#/definitions/NewPostBodyParam'
      responses:
        '200':
          description: Success. Returns updated post
          schema:
            $ref: "#/definitions/NewPostResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  "/topics/{topicId}/posts/list":
    get:
      summary: Adds a post to the given topic
      description: Lists the posts of the given topic.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic
          required: true
          type: number
        - in: query
          name: postIds
          required: true
          type: string
          description: comma separated ids of the posts to be fetched
      tags:
        - Posts
      security:
        - Bearer: []
      responses:
        200:
          description: Success. Returns newly created post
          schema:
            $ref: "#/definitions/PostListResponse"
        500:
          description: Response Had Error
          schema:
            $ref: '#/definitions/ObjectWithMessage'
        403:
          description: Invalid JWT Token
          schema:
            $ref: '#/definitions/ObjectWithMessage'
  /topics/{topicId}/posts/{postId}/read:
    get:
      tags:
        - Posts
      operationId: getPost
      security:
        - Bearer: []
      summary: Get post
      description: Fetches the details of the specified post.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic
          required: true
          type: number
        - name: postId
          in: path
          description: id of the post to be fetched
          required: true
          type: number
      responses:
        '200':
          description: Success. Returns the topic
          schema:
            $ref: "#/definitions/PostResponse"
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/{topicId}/posts/{postId}/remove:
    delete:
      tags:
        - Posts
      operationId: deletePost
      security:
        - Bearer: []
      summary: Delete topic
      description: Deletes the specified topic.
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - name: topicId
          in: path
          description: id of the topic of the post to be deleted
          required: true
          type: number
        - name: postId
          in: path
          description: id of the post to be fetched
          required: true
          type: number
      responses:
        '200':
          description: Success.
        '403':
          $ref: "#/responses/InvalidAccess"
        '404':
          $ref: "#/responses/NotFound"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/attachments:
    post:
      tags:
        - Attachments
      security:
        - Bearer: []
      summary: Create attachment
      description: Creates new attachment. Copies the file from source bucket to the target bucket. Adds a new DB record with postId=null
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - in: body
          name: CreateAttachmentBody
          required: true
          description: CreateAttachment payload
          schema:
            $ref: "#/definitions/CreateAttachmentBody"
      responses:
        '200':
          $ref: "#/definitions/CreateAttachmentResponse"
        '500':
          $ref: "#/responses/UnexpectedFailure"
          
  /topics/attachments/{attachmentId}/read:
    get:
      tags:
        - Attachments
      security:
        - Bearer: []
      summary: Get attachment
      description: Gets the request attachment
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - in: path
          name: attachmentId
          description: Requested Attachment ID
          required: true
          type: number
      responses:
        '200':
          description: Gets a signed URL and starts download
        '404':
          $ref: "#/responses/NotFound"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/attachments/{attachmentId}/delete:
    delete:
      tags:
        - Attachments
      security:
        - Bearer: []
      summary: Delete attachment
      description: Deletes the specified attachment
      parameters:
        - in: header
          name: Authorization
          description: Authorization token
          required: true
          type: string
        - in: path
          name: attachmentId
          description: Attachment ID
          required: true
          type: number
      responses:
        '200':
          description: Success. 
        '404':
          $ref: "#/responses/NotFound"
        '403':
          $ref: "#/responses/InvalidAccess"
        '400':
          $ref: "#/responses/ValidationFailure"
        '500':
          $ref: "#/responses/UnexpectedFailure"
    
  /topics/webhooks/sendgrid:
    post:
      tags:
        - Webhooks
      operationId: handleSendgridWebhook
      summary: handle sendgrid event
      description: This endpoint supports incoming emails for replying to posts via replying to notification emails. It creates post for the topic identified by to email address of incoming email.
      parameters:
        - in: body
          name: body
          required: true
          description: Sendgrid payload
          schema:
            $ref: '#/definitions/SendgridBodyParam'
      responses:
        '200':
          description: Success.
        '400':
          $ref: "#/responses/ValidationFailure"
        '500':
          $ref: "#/responses/UnexpectedFailure"
          
  /topics/admin/ownership/edit:
    post:
      tags:
        - Admins
      operationId: admin update ownership
      security:
        - Bearer: []
      summary: Update ownership
      description: Update the topic/post ownership
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AdminUpdateOwnershipBodyParam'
      responses:
        '200':
          description: Success. Returns updated topic/post
          schema:
            $ref: "#/definitions/UpdateOwnershipResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/admin/posts/{postId}/stats/create:
    post:
      tags:
        - Admins
      operationId: adminCreatePostStats
      security:
        - Bearer: []
      summary: Create post stats
      description: Creates the specified post stats.
      parameters:
        - name: postId
          in: path
          description: id of the post to be updated
          required: true
          type: number
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AdminCreatePostStatsBodyParam'
      responses:
        '200':
          description: Success. Returns newly created postUserStats
          schema:
            $ref: "#/definitions/NewPostUserStatsResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/admin/posts/{postId}/edit:
    post:
      tags:
        - Admins
      operationId: adminUpdatePost
      security:
        - Bearer: []
      summary: Update post
      description: Updates the specified post.
      parameters:
        - name: postId
          in: path
          description: id of the post to be updated
          required: true
          type: number
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/AdminUpdatePostBodyParam'
      responses:
        '200':
          description: Success. Returns updated topic
          schema:
            $ref: "#/definitions/NewPostResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/admin/topics/{topicId}/edit:
    post:
      tags:
        - Admins
      operationId: adminUpdateTopic
      security:
        - Bearer: []
      summary: Update topic
      description: Updates the specified topic.
      parameters:
        - name: topicId
          in: path
          description: id of the topic to be updated
          required: true
          type: number
        - in: body
          name: body
          required: true
          description: Topic parameters
          schema:
            $ref: '#/definitions/AdminUpdateTopicBodyParam'
      responses:
        '200':
          description: Success. Returns newly created topic
          schema:
            $ref: "#/definitions/NewTopicResponse"
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
          
  /topics/health:
    post:
      tags:
        - Others
      operationId: checkHealth
      summary: Check health
      description: Check the server health
      responses:
        '200':
          description: Success. Returns Server state.
          schema:
            properties:
              message:
                type: string
        '400':
          $ref: "#/responses/ValidationFailure"
        '500':
          $ref: "#/responses/UnexpectedFailure"
  /topics/esindex:
    post:
      tags:
        - Others
      operationId: adminUpdateTopicToEs
      security:
        - Bearer: []
      summary: Update topic to es
      description: Update the topics from database to elasticsearch.
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/UpdateEsIndexBodyParam'
      responses:
        '200':
          description: Success. Returns update result
          schema:
            properties:
              message:
                type: string
        '400':
          $ref: "#/responses/ValidationFailure"
        '403':
          $ref: "#/responses/InvalidAccess"
        '500':
          $ref: "#/responses/UnexpectedFailure"
definitions:
  NewTopicBodyParam:
    type: object
    required:
       - reference
       - referenceId
       - tag
       - title
       - body
    properties:
      reference:
        type: string
        description: type of entity with which the topic is associated, e.g. 'project', 'challenge', 'submission', etc.
      referenceId:
        type: string
        description: id of entity with which the topic is associated, e.g. '455'.
      attachmentIds:
        type: array
        items:
          type: number
        description: attachment id of entity with which the topic is associated.
      tag:
        type: string
        description: tag field of the topic, e.g. 'PRIMARY'
      title:
        type: string
        description: title of the topic
      body:
        type: string
        description: body of the topic message, supports markup
  
  UpdateTopicBodyParam:
    type: object
    required:
       - postId
       - title
       - content
    properties:
      postId:
        type: number
        description: id of the body post(i.e. 0th post) of the topic
      title:
        type: string
        description: title of the topic
      content:
        type: string
        description: body of the topic/message
      attachmentIds:
        type: array
        items:
          type: number
        description: attachment id of entity with which the topic is associated.
  AdminUpdateOwnershipBodyParam:
    type: object
    required:
      - userId
      - topicId
    properties:
      postId:
        type: number
      userId:
        type: number
      topicId:
        type: number
  AdminCreatePostStatsBodyParam:
    type: object
    required:
      - postId
      - userId
      - topicId
      - action
    properties:
      postId:
        type: number
      userId:
        type: number
      topicId:
        type: number
      action:
        type: string
  NewPostUserStatsResponse:
    type: object
    properties:
      postId:
        type: number
      userIds:
        type: array
        items:
          type: string
      topicId:
        type: number
      action:
        type: string
  AdminUpdateTopicBodyParam:
    type: object
    required:
       - topic
    properties:
      topic:
        type: object
        properties:
          title:
            type: string
            description: title of the topic
          reference:
            type: string
          referenceId:
            type: string
          tag:
            type: string
          createdAt:
            type: string
            format: date
          createdBy:
            type: number
          updatedAt:
            type: string
            format: date
          updatedBy:
            type: number
          highestPostNumber:
            type: number
          closed:
            type: boolean
          hidden:
            type: boolean
          archived:
            type: boolean
          hiddenReason:
            type: string
          deletedAt:
            type: string
            format: date
          deletedBy:
            type: number
  AdminUpdatePostBodyParam:
    type: object
    required:
       - topicId
       - post
    properties:
      topicId:
        type: number
        description: the id of topic
      post:
        type: object
        properties:
          raw:
            type: string
          cooked:
            type: string
          topicId:
            type: number
          postNumber:
            type: number
          viaEmail:
            type: boolean
          rawEmail:
            type: string
          hidden:
            type: boolean
          hiddenReason:
            type: string
          createdAt:
            type: string
            format: date
          createdBy:
            type: number
          updatedAt:
            type: string
            format: date
          updatedBy:
            type: number
          deletedAt:
            type: string
            format: date
          deletedBy:
            type: number
            
  NewPostBodyParam:
    type: object
    required:
       - post
    properties:
      post:
        type: string
        description: content of the post
      attachmentIds:
        type: array
        items:
          type: number
        description: attachment id of the post associated.
  UpdateOwnershipResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
            allOf:
              - $ref: "#/definitions/TopicObject"
              - $ref: "#/definitions/PostObject"

  NewTopicResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
            $ref: "#/definitions/TopicObject"
  
  NewPostResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
            $ref: "#/definitions/PostObject"
  TopicListResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
            type: array
            description: list of topic objects
            items:
              $ref: "#/definitions/TopicObject"
  
  TopicResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
              $ref: "#/definitions/TopicObject"

  TopicObject:
    type: object
    description: Topic object
    properties:
      id:
        type: string
        description: identifier for topic
      title:
        type: string
        description: title of the topic
      date:
        type: string
        description: creation date of the topic
      updatedDate:
        type: string
        description: updation date of the topic
      lastActivityAt:
        type: string
        description: date of the last activity in the topic
      reference:
        type: string
        description: type of the referenced/associated entity
      referenceId:
        type: string
        description: id of the referenced/associated entity
      tag:
        type: string
        description: tag of the topic
      retrievedPosts:
        type: number
        description: number of the posts retrieved (including body post)
      totalPosts:
        type: number
        description: number of total posts in this topic (including body post)
      userId:
        type: string
        description: id of the user who created the topic 
      postIds:
        type: array
        items:
          type: number
        description: array of ids of the posts in the topic
      posts:
        type: array
        items:
          $ref: "#/definitions/PostObject"
        description: array of posts in the topic
              
  PostListResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
            type: array
            description: list of topic objects
            items:
              $ref: "#/definitions/PostObject"
  PostResponse:
    type: object
    properties:
      id:
        type: string
        description: unique id identifying the request
      version:
        type: string
        description: the api version
      result:
        type: object
        properties:
          success:
            type: boolean
            description: whether the result is successful
          status:
            description: http status code
            type: integer
            format: int32
          metadata:
            type: object
            description: result metadata
          content:
              $ref: "#/definitions/PostObject"
  PostObject:
    type: object
    description: Post object
    properties:
      id:
        type: integer
        description: identifier for post
      type:
        type: string
        description: type of the post, currently only 'post' is the supported value
      date:
        type: string
        description: creation date of the post
      updatedDate:
        type: string
        description: updation date of the post
      userId:
        type: string
        description: id of the user who created the post
      body:
        type: string
        description: content of the post (earlier it used to be cooked content i.e. markdown converted to HTML), however, with V5 release, it also returns the raw content as with `rawContent` field. Field is reatined for backward compatability
      attachments:
        $ref: "#/definitions/AttachmentObject" 
      rawContent:
        type: string
        description: content of the post in raw form i.e. no cooking done
      read:
        type: boolean
        description: flag to indicate that if the calling user has read this post in past or not
        
  CreateAttachmentBody:
    description: Create Attachment object
    required: 
    - "filename"
    - "bucket"
    properties: 
      filename: 
        description: The filename that will be copied from the source bucket
        type: "string"
        example: "test.txt"
      bucket: 
        description: The source bucket
        type: "string"
        example: "public-bucket"
      path: 
        description: The path to the file (in the source bucket)
        type: "string"
        example: "sub_directory"

  CreateAttachmentResponse:
    type: object
    description: Success.
    properties:
      id: 
        type: "string"
        example: "66f1ed89-b797-4995-a7f1-8385739923b9"
      version: 
        type: "string"
        example: "v5"
      result: 
        properties: 
          success: 
            type: "boolean"
            example: true
          status: 
            type: "number"
            example: 200
          content:
            properties: 
              id: 
                type: "number"
                example: 7
              originalFileName: 
                type: "string"
                example: "test_under_dir.txt"
              fileSize: 
                type: "number"
                example: 1048576
              createdBy: 
                type: "string"
                example: "magrathean"
              updatedBy: 
                type: "string"
                example: "magrathean"
              updatedAt: 
                type: "string"
                example: "2019-04-15T06:55:57.671Z"
              createdAt: 
                type: "string"
                example: "2019-04-15T06:55:57.671Z"
          metadata: 
            properties: 
              totalCount: 
                type: "number"
                example: 1
                
  AttachmentObject:
    type: object
    properties: 
      id: 
        type: "number"
        example: 1
      date: 
        type: "string"
        example: "2019-04-15T03:21:48.030Z"
      updatedDate: 
        type: "string"
        example: "2019-04-15T03:26:16.256Z"
      originalFileName: 
        type: "string"
        example: "test.txt"
      createdBy: 
        type: "string"
        example: "magrathean"

    

  ErrorResponse:
