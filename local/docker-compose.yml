version: '2'
services:
    mock-services:
        build: 'mock-services'
        ports:
            - 3001:3001
    postgres:
        image: postgres:9.5
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: 'coder'
            POSTGRES_PASSWORD: 'mysecretpassword'
            POSTGRES_DB: 'messages'
    esearch:
      image: "elasticsearch:2.3"
      # image: docker.elastic.co/elasticsearch/elasticsearch:6.2.4
      ports:
        - "9200:9200"
        - "9300:9300"
volumes:
  esdata:
    driver: local
