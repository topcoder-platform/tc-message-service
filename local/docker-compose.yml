version: '2'
services:
    mock-services:
        container_name: mock-services
        build: 'mock-services'
        ports:
            - 3001:3001
    postgres:
        image: postgres:9.5
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: 'coder'
            POSTGRES_PASSWORD: 'mysecretpassword'
            POSTGRES_DB: 'messages'
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:6.2.4
        container_name: elasticsearch_620
        environment:
          - http.host=0.0.0.0
          - transport.host=0.0.0.0
          - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
        volumes:
          - esdata:/usr/share/elasticsearch/data
          - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
        ports:
          - 9200:9200
          - 9300:9300
        ulimits:
          memlock:
            soft: -1
            hard: -1
          nofile:
            soft: 65536
            hard: 65536
        mem_limit: 2g
volumes:
  esdata:
    driver: local
