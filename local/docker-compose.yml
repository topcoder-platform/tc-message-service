version: '3'
services:
    mock-services:
        container_name: mock-services
        build: 'mock-services'
        ports:
            - 3001:3001
    postgres:
        build: './postgres-db'
        ports:
            - '5432:5432'
        environment:
            POSTGRES_USER: 'coder'
            POSTGRES_PASSWORD: 'mysecretpassword'
            POSTGRES_MULTIPLE_DATABASES: 'messages,messages_test'
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:6.2.4
        container_name: elasticsearch_620
        environment:
          - http.host=0.0.0.0
          - transport.host=0.0.0.0
          - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
        volumes:
          - esdata:/usr/share/elasticsearch/data
          - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
        ports:
          - 9200:9200
          - 9300:9300
        ulimits:
          memlock:
            soft: -1
            hard: -1
          nofile:
            soft: 65536
            hard: 65536
        mem_limit: 2g
    zookeeper:
        image: wurstmeister/zookeeper
        container_name: tc-message-zookeeper
        ports:
          - 2181:2181
    kafka:
        image: wurstmeister/kafka
        container_name: tc-message-kafka
        depends_on:
          - zookeeper
        ports:
          - 9092:9092
        environment:
          KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
          KAFKA_LISTENERS: INSIDE://kafka:9093,OUTSIDE://0.0.0.0:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

    kafka-client:
        container_name: tc-kafka-client
        build: ./kafka-client
        depends_on:
          - kafka
          - zookeeper
    tc-bus-api:
        container_name: tc-bus-api
        build:
            context: ./generic-tc-service
            args:
                NODE_VERSION: 8.11.3
                GIT_URL: https://github.com/topcoder-platform/tc-bus-api
                GIT_BRANCH: dev
                BYPASS_TOKEN_VALIDATION: 1
        command: start kafka-client
        ports:
          - 8002:8002
        depends_on:
          - kafka-client
        environment:
          - PORT=8002
          - KAFKA_URL=kafka:9093
          - JWT_TOKEN_SECRET=secret
          - VALID_ISSUERS="[\"https:\/\/topcoder-newauth.auth0.com\/\",\"https:\/\/api.topcoder-dev.com\",\"https:\/\/topcoder-dev.auth0.com\/\"]"
          - AUTH0_URL
          - AUTH0_AUDIENCE
          - AUTH0_CLIENT_ID
          - AUTH0_CLIENT_SECRET
          - AUTH0_PROXY_SERVER_URL
    dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - "8000:8000"
volumes:
  esdata:
    driver: local
