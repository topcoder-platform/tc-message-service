version: 2
defaults: &defaults
    docker:
      - image: cimg/python:3.11.7-browsers  
install_dependency: &install_dependency
          name: Installation of build and deployment dependencies.
          command: |
            sudo apt update
            sudo apt install jq python3-pip
            sudo pip3 install awscli --upgrade
            
install_deploysuite: &install_deploysuite
          name: Installation of install_deploysuite.
          command: |
            git clone --branch v1.4.15 https://github.com/topcoder-platform/tc-deploy-scripts ../buildscript    
            cp ./../buildscript/master_deploy.sh .
            cp ./../buildscript/buildenv.sh .
            cp ./../buildscript/awsconfiguration.sh .

run_build: &run_build
          name: Build of Docker image
          command: ./build.sh
jobs:
  test:
    docker:
      - image: circleci/node:8.9.4
      - image: circleci/postgres:9.6.2-alpine
        environment:
        - POSTGRES_USER: circle_test
        - POSTGRES_DB: circle_test
      - image: docker.elastic.co/elasticsearch/elasticsearch:6.2.4
    environment:
      DB_MASTER_URL: postgres://circle_test:@127.0.0.1:5432/circle_test
      AUTH_SECRET: secret
      AUTH_DOMAIN: topcoder-dev.com
      LOG_LEVEL: debug
      APP_VERSION: v4
    steps:
      - checkout
      # - restore_cache:
          # key: test-node-modules-{{ checksum "yarn.lock" }}
      - run: npm install
      # - save_cache:
          # key: test-node-modules-{{ checksum "yarn.lock" }}
          # paths:
            # - node_modules
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - dist

  deployDev:
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker
      - run: *install_dependency
      - run: *install_deploysuite
      - attach_workspace:
          at: ./workspace
      - run: *run_build
      - deploy:
          name: Running Masterscript - deploy tc-message-service
          command: |    
            ./awsconfiguration.sh DEV
            source awsenvconf
            ./buildenv.sh -e DEV -b dev-tc-message-service-deployvar
            source buildenvvar
            ./master_deploy.sh -d ECS -e DEV -t latest -s dev-global-appvar,dev-tc-message-service-appvar -i tc-message-service -p FARGATE 
  deployProd:
    <<: *defaults
    steps:
      - checkout
      - setup_remote_docker
      - run: *install_dependency
      - run: *install_deploysuite
      - attach_workspace:
          at: ./workspace
      - run: *run_build
      - deploy:
          name: Running Masterscript - deploy tc-message-service
          command: |    
            ./awsconfiguration.sh PROD
            source awsenvconf
            ./buildenv.sh -e PROD -b prod-tc-message-service-deployvar
            source buildenvvar
            ./master_deploy.sh -d ECS -e PROD -t latest -s prod-global-appvar,prod-tc-message-service-appvar -i tc-message-service -p FARGATE 
workflows:
  version: 2
  build:
    jobs:
      - deployDev:
          context : org-global
          filters:
            branches:
              only: [dev,dev-sts,v5-upgrade]
      - deployProd:
          context : org-global
          filters:
            branches:
              only: 'master'
